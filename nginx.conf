events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # ─── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/json
        application/javascript application/x-javascript text/xml
        application/xml application/xml+rss image/svg+xml;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Rate Limiting Zones ──────────────────────────────────────────────────
    # General API: 60 requests/min per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
    # Auth endpoints: 10 requests/min per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # Admin endpoints: 30 requests/min per IP
    limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=30r/m;
    # Search endpoints: 30 requests/min per IP
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=30r/m;

    limit_req_status 429;

    # ─── Main Application Server ──────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost travelos.com www.travelos.com;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy
            "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; frame-ancestors 'none';"
            always;

        # ── Frontend ──────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth (strict rate limit) ───────────────────────────────────────────
        location ~ ^/api/v1/auth/(login|register|refresh) {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Search (moderate rate limit) ──────────────────────────────────────
        location ~ ^/api/v1/(flights|hotels|cabs|activities)/search {
            limit_req zone=search_zone burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # ── Health check (no rate limit) ──────────────────────────────────────
        location /healthz {
            proxy_pass http://backend:8000;
            access_log off;
        }

        # ── Static files with caching ─────────────────────────────────────────
        location /static {
            proxy_pass http://backend:8000;
            proxy_cache_valid 200 1d;
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # ─── Admin Server ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name admin.travelos.com;

        # Restrict to admin origins only
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://admin-console:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            limit_req zone=admin_zone burst=10 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

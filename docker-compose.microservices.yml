      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=flights
      - DATABASE_URL=postgresql://postgres:postgres@db_flights:5432/flights_db
      - REDIS_URL=redis://redis:6379/0

  hotel-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=hotels
      - DATABASE_URL=postgresql://postgres:postgres@db_hotels:5432/hotels_db
      - REDIS_URL=redis://redis:6379/0

  wallet-service:

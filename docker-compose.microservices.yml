      - "8006:8006"
    environment:
      - SERVICE_NAME=payments
      - DATABASE_URL=postgresql://postgres:postgres@db_payments:5432/payments_db
      - REDIS_URL=redis://redis:6379/0

  ai-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007
    ports:
      - "8007:8007"
    environment:
      - SERVICE_NAME=ai
      - DATABASE_URL=postgresql://postgres:postgres@db_ai:5432/ai_db
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

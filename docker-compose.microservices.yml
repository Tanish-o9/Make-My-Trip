      - "8005:8005"
    environment:
      - SERVICE_NAME=wallet
      - DATABASE_URL=postgresql://postgres:postgres@db_wallet:5432/wallet_db
      - REDIS_URL=redis://redis:6379/0

  payment-service:
    build:
      context: ./backend

version: '3.8'

services:
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=gateway
      - DATABASE_URL=postgresql://postgres:postgres@db_gateway:5432/gateway_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  identity-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=identity
      - DATABASE_URL=postgresql://postgres:postgres@db_identity:5432/identity_db
      - REDIS_URL=redis://redis:6379/0

  booking-service:

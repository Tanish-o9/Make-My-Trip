      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=booking
      - DATABASE_URL=postgresql://postgres:postgres@db_booking:5432/booking_db
      - REDIS_URL=redis://redis:6379/0

  flight-service:

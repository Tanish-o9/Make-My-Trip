apiVersion: v1
kind: ConfigMap
metadata:
  name: travel-os-config
  namespace: travel-os
data:
  PYTHONPATH: "/app"
  STORAGE_BACKEND: "local"
  CHROMADB_HOST: "chromadb"
  CHROMADB_PORT: "8000"
  ALLOWED_ORIGINS: "https://travelos.com,https://www.travelos.com,https://admin.travelos.com"
  ADMIN_ALLOWED_ORIGINS: "https://admin.travelos.com"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: travel-os-secrets
  namespace: travel-os
type: Opaque
stringData:
  # Replace these with real values using:
  # kubectl create secret generic travel-os-secrets --from-env-file=.env -n travel-os
  DATABASE_URL: "postgresql://travel_user:CHANGE_ME@postgres:5432/travel_os"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET_KEY: "CHANGE_ME_use_openssl_rand_hex_32"
  RAZORPAY_KEY_ID: "CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  DUFFEL_ACCESS_TOKEN: "CHANGE_ME"
  SENTRY_DSN: ""
  GROQ_API_KEY: ""
  OPENAI_API_KEY: ""

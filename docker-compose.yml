version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_os_postgres
    environment:
      POSTGRES_DB: travel_os
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_os_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: travel_os_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel_os_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://travel_user:travel_password@postgres:5432/travel_os
      - REDIS_URL=redis://redis:6379/0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - STORAGE_BACKEND=local
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - upload_data:/app/static/uploads

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel_os_celery_worker
    restart: always
    command: celery -A app.tasks worker --loglevel=info --concurrency=4 -Q default,email,notifications,refunds,reminders
    environment:
      - DATABASE_URL=postgresql://travel_user:travel_password@postgres:5432/travel_os
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel_os_celery_beat
    restart: always
    command: celery -A app.tasks beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    environment:
      - DATABASE_URL=postgresql://travel_user:travel_password@postgres:5432/travel_os
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    env_file:
      - backend/.env
    depends_on:
      - celery-worker

  flower:
    image: mher/flower:2.0
    container_name: travel_os_flower
    restart: always
    command: celery flower --broker=redis://redis:6379/1 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_os_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin-console:
    build:
      context: ./admin-console
      dockerfile: Dockerfile
    container_name: travel_os_admin_console
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: travel_os_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin-console
    restart: always

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: travel_os_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: always

  grafana:
    image: grafana/grafana:10.2.0
    container_name: travel_os_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: always

volumes:
  pgdata:
  redisdata:
  chromadata:
  upload_data:
  prometheusdata:
  grafanadata:
